<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1a2a6c" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Urna Eletrônica — UMP POPB</title>
  <link rel="icon" type="image/png" href="/assets/img/logo_icone.png" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --blue: #1a2a6c;
      --blue2: #0d1640;
      --orange: #e8630a;
      --red: #c0392b;
      --white: #ffffff;
      --gray50: #f8fafc;
      --gray100: #f1f5f9;
      --gray200: #e2e8f0;
      --gray400: #94a3b8;
      --gray600: #475569;
      --gray800: #1e293b;
      --radius: 12px;
      --shadow: 0 10px 30px rgba(0, 0, 0, .1);
      --green: #16a34a;
      --green-dark: #15803d;
    }

    html,
    body {
      height: 100%;
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: linear-gradient(135deg, #f8fafc 0%, #eff6ff 50%, #dbeafe 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: .65rem;
      position: relative;
      overflow-y: auto;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 10% 20%, rgba(37, 99, 235, .05) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(26, 42, 108, .07) 0%, transparent 50%);
      pointer-events: none;
    }

    .vote-wrapper {
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 1;
      margin: auto;
    }

    .vote-logo-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .65rem;
      margin-bottom: .65rem;
    }

    .vote-logo {
      width: 38px;
      height: 38px;
      object-fit: contain;
      filter: drop-shadow(0 3px 8px rgba(26, 42, 108, .15));
    }

    .vote-brand {
      text-align: left;
    }

    .vote-brand h1 {
      font-size: .95rem;
      font-weight: 800;
      color: #1a2a6c;
      line-height: 1.2;
    }

    .vote-brand p {
      font-size: .72rem;
      color: #475569;
      font-weight: 500;
      line-height: 1.2;
      margin-top: 1px;
    }

    .vote-card {
      background: rgba(255, 255, 255, .98);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.1rem 1.2rem;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.7);
    }

    .vote-card h2 {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--gray800);
      margin-bottom: .9rem;
      text-align: center;
    }

    .field {
      margin-bottom: .85rem;
      display: flex;
      flex-direction: column;
      gap: .3rem;
    }

    .field label {
      font-size: .78rem;
      font-weight: 600;
      color: var(--gray600);
    }

    .input {
      width: 100%;
      padding: .65rem .85rem;
      border: 1.5px solid var(--gray200);
      border-radius: 8px;
      font-size: .95rem;
      font-family: inherit;
      color: var(--gray800);
      background: var(--gray50);
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }

    .input:focus {
      border-color: #1a2a6c;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(26, 42, 108, .12);
    }

    .btn {
      width: 100%;
      padding: .65rem .85rem;
      background: linear-gradient(135deg, #1a2a6c, #2a3f9f);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: .92rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: opacity .15s, transform .1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .45rem;
      min-height: 42px;
    }

    .btn:hover:not(:disabled) {
      opacity: .93;
      transform: translateY(-1px);
    }

    .btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .btn-success {
      background: linear-gradient(135deg, var(--green), var(--green-dark));
    }

    .btn-secondary {
      background: var(--gray200);
      color: var(--gray800);
    }

    .alert {
      padding: .6rem .85rem;
      border-radius: 8px;
      font-size: .8rem;
      line-height: 1.4;
    }

    .alert-error {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .alert-success {
      background: #f0fdf4;
      color: #166534;
      border: 1px solid #bbf7d0;
    }

    .hidden {
      display: none !important;
    }

    /* Ballot Header Strip */
    .ballot-header-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .5rem;
      padding: .6rem .85rem;
      background: var(--gray50);
      border: 1.5px solid var(--gray200);
      border-radius: 10px;
      margin-bottom: .75rem;
    }

    .ballot-subtitle {
      font-size: .72rem;
      color: var(--gray600);
      font-weight: 500;
      display: block;
      line-height: 1.2;
    }

    .ballot-role-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: #1a2a6c;
      margin: 0;
      line-height: 1.2;
    }

    .badge-step-pill {
      padding: .22rem .55rem;
      background: #1a2a6c;
      color: #fff;
      border-radius: 14px;
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* Candidate Cards in Urna */
    .candidates-list {
      display: flex;
      flex-direction: column;
      gap: .4rem;
      max-height: clamp(150px, 34vh, 225px);
      overflow-y: auto;
      padding: 2px;
      margin-bottom: .75rem;
    }

    .candidate-card {
      display: flex;
      align-items: center;
      gap: .65rem;
      padding: .45rem .75rem;
      background: #ffffff;
      border: 1.5px solid var(--gray200);
      border-radius: 10px;
      cursor: pointer;
      transition: all .15s ease;
      user-select: none;
    }

    .candidate-card:hover {
      border-color: #93c5fd;
      background: #f8fafc;
    }

    .candidate-card.selected {
      border-color: #2563eb !important;
      background: #eff6ff !important;
      box-shadow: 0 3px 10px rgba(37, 99, 235, 0.12) !important;
    }

    .candidate-card.selected .candidate-check-circle {
      border-color: #2563eb;
      background: #2563eb;
      color: #ffffff;
    }

    .candidate-avatar-wrap {
      flex-shrink: 0;
    }

    .candidate-info {
      flex: 1;
      min-width: 0;
    }

    .candidate-name {
      font-size: .88rem;
      font-weight: 700;
      color: var(--gray800);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .candidate-sub {
      font-size: .68rem;
      color: var(--gray600);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: .05rem;
    }

    .candidate-check-circle {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1.5px solid var(--gray400);
      display: flex;
      align-items: center;
      justify-content: center;
      color: transparent;
      transition: all .15s ease;
      flex-shrink: 0;
    }

    .candidate-search-wrap {
      margin-bottom: .45rem;
      position: relative;
    }

    .candidate-search-wrap input {
      width: 100%;
      padding: .4rem .65rem .4rem 2rem;
      border: 1.5px solid var(--gray200);
      border-radius: 8px;
      font-size: .82rem;
      font-family: inherit;
      color: var(--gray800);
      background: var(--gray50);
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }

    .candidate-search-wrap input:focus {
      border-color: #2563eb;
      background: #ffffff;
      box-shadow: 0 0 0 2.5px rgba(37, 99, 235, .1);
    }

    .candidate-search-icon {
      position: absolute;
      left: .65rem;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: var(--gray400);
      display: flex;
      align-items: center;
    }

    .text-center {
      text-align: center;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, .3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: inline-block;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div class="vote-wrapper">

    <div class="vote-logo-wrap">
      <img class="vote-logo" src="/assets/img/logo.png" alt="Logo UMP" />
      <div class="vote-brand">
        <h1>Módulo de Eleição - SIGES FPOPB</h1>
        <p id="society-subtitle">Plataforma de Gestão</p>
      </div>
    </div>

    <!-- ── CARD: STEP 1 (LOGIN WITH ACCESS CODE) ── -->
    <div class="vote-card" id="card-login">
      <h2>Código Secreto de Votante</h2>
      <div id="login-alert" class="hidden" style="margin-bottom: .85rem;"></div>

      <div class="field">
        <label for="voter-code">Insira seu código de 6 caracteres</label>
        <input class="input text-center" type="text" id="voter-code" maxlength="6" placeholder="A1B2C3"
          style="text-transform: uppercase; font-family: monospace; font-size: 1.25rem; letter-spacing: 2.5px; font-weight: 700; height: 46px;" />
      </div>

      <button class="btn" id="btn-login-code">Entrar na Seção Secreta</button>
    </div>

    <!-- ── CARD: STEP 2 (CAST VOTE) ── -->
    <div class="vote-card hidden" id="card-ballot">
      <div class="ballot-header-box">
        <div style="min-width:0">
          <span class="ballot-subtitle" id="ballot-title">Eleição</span>
          <h2 class="ballot-role-title" id="ballot-step-badge">Presidente</h2>
        </div>
        <span class="badge-step-pill" id="ballot-role-label">1º Escrutínio</span>
      </div>

      <div id="ballot-alert" class="hidden" style="margin-bottom: .75rem;"></div>

      <!-- Active Voting state -->
      <div id="ballot-active-state">
        <div class="field" style="margin-bottom: .65rem;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:.35rem;">
            <label style="margin:0; font-size:.8rem; font-weight:700; color:var(--gray800);">Escolha o Candidato:</label>
            <span id="candidates-count-badge" style="font-size:.68rem; font-weight:600; color:var(--gray600); background:var(--gray100); padding:2px 7px; border-radius:10px;">0 candidatos</span>
          </div>

          <div id="candidate-search-wrap" class="candidate-search-wrap hidden">
            <span class="candidate-search-icon">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </span>
            <input type="text" id="candidate-search-input" placeholder="Buscar candidato por nome..." />
          </div>

          <div class="candidates-list" id="candidates-list">
            <!-- Populated dynamically with candidate cards and avatars -->
          </div>
        </div>

        <button class="btn btn-success" id="btn-cast-vote">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
          <span id="btn-cast-vote-text">Confirmar Voto</span>
        </button>

        <div style="font-size: .7rem; color: var(--gray600); display: flex; align-items: center; justify-content: center; gap: .35rem; margin-top: .6rem; text-align: center; line-height: 1.3;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--green); flex-shrink: 0;"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          <span><strong>Voto Secreto:</strong> Seu voto não fica vinculado ao seu nome ou código.</span>
        </div>
      </div>

      <!-- Voted / Wait state -->
      <div id="ballot-voted-state" class="hidden text-center" style="padding: .75rem 0;">
        <div style="margin-bottom: .65rem;">
          <img src="/assets/img/check.png" style="width: 48px; height: 48px; margin: 0 auto; display: block;"
            alt="Voto Computado" />
        </div>
        <h3 style="font-size: 1.05rem; color: var(--gray800); margin-bottom: .35rem; font-weight: 700;">Voto Computado com Sucesso!</h3>
        <p style="font-size: .8rem; color: var(--gray600); line-height: 1.5; margin-bottom: 1rem;">
          Seu voto secreto foi computado. Aguarde o encerramento da votação.
        </p>
        <button class="btn btn-secondary" id="btn-refresh-status"
          style="display: inline-flex; align-items: center; gap: .45rem; justify-content: center; margin: 0 auto; font-size: .85rem; padding: .55rem 1rem;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
          <span>Votar Próximo Cargo</span>
        </button>
      </div>

      <!-- Sair / Trocar de Código -->
      <div style="margin-top: .65rem; border-top: 1px solid var(--gray200); padding-top: .5rem; text-align: center;">
        <button class="btn btn-secondary" id="btn-logout"
          style="width: auto; margin: 0 auto; padding: .35rem .85rem; font-size: .75rem; min-height: auto; display: inline-flex; align-items: center; gap: .4rem; justify-content: center;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
          <span>Sair / Votar com outro código</span>
        </button>
      </div>
    </div>

  </div>

  <!-- API client dependencies -->
  <script type="module">
    import { avatarHtml } from '/assets/js/utils.js?v=9'

    const BASE_URL = 'https://umpgestaopopb-825585682536.us-west1.run.app'
    // Local development fallback
    const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
    const API_URL = isLocal ? 'http://localhost:8000' : BASE_URL

    const cardLogin = document.getElementById('card-login')
    const cardBallot = document.getElementById('card-ballot')

    let voterCode = ''
    let currentSession = null
    let selectedCandidateId = null
    let selectedCandidateName = ''

    // Check query string for session/code
    const urlParams = new URLSearchParams(window.location.search)
    const codeParam = urlParams.get('code')
    if (codeParam) {
      document.getElementById('voter-code').value = codeParam.toUpperCase().trim()
      setTimeout(() => {
        document.getElementById('btn-login-code').click()
      }, 150)
    }

    // Set local UMP/UPH/etc label if available
    const societyType = localStorage.getItem('society_type') || 'UMP'
    const subtitleEl = document.getElementById('society-subtitle')
    if (subtitleEl) {
      subtitleEl.textContent = `Plataforma de Gestão ${societyType}`
    }

    // Alert helpers
    function showAlert(id, message, type = 'error') {
      const el = document.getElementById(id)
      el.innerHTML = `<div class="alert alert-${type}">${message}</div>`
      el.classList.remove('hidden')
    }

    function clearAlert(id) {
      const el = document.getElementById(id)
      el.innerHTML = ''
      el.classList.add('hidden')
    }

    function setLoading(btn, loading, text) {
      btn.disabled = loading
      btn.innerHTML = loading ? `<span class="spinner"></span> Aguarde...` : text
    }

    // Step 1: Login Code
    document.getElementById('btn-login-code').addEventListener('click', async () => {
      const codeEl = document.getElementById('voter-code')
      const code = codeEl.value.trim().toUpperCase()

      if (code.length !== 6) {
        showAlert('login-alert', 'Por favor, insira o código de 6 caracteres.')
        return
      }

      const btn = document.getElementById('btn-login-code')
      setLoading(btn, true, 'Entrar na Seção Secreta')
      clearAlert('login-alert')

      try {
        const res = await fetch(`${API_URL}/api/elections/public/session?code=${code}`)
        if (!res.ok) {
          const err = await res.json()
          throw new Error(err.detail || 'Código inválido ou expirado.')
        }

        const data = await res.json()
        voterCode = code
        currentSession = data

        // Navigate to ballot card
        cardLogin.classList.add('hidden')
        cardBallot.classList.remove('hidden')
        renderBallotScreen()
      } catch (err) {
        showAlert('login-alert', err.message)
      } finally {
        setLoading(btn, false, 'Entrar na Seção Secreta')
      }
    })

    // Render Candidate Cards with Avatars and selection (NO BLANK / NULL OPTION)
    function renderCandidatesCards(filterText = '') {
      const listContainer = document.getElementById('candidates-list')
      const query = filterText.toLowerCase().trim()

      const candidates = currentSession.candidates || []
      const filtered = candidates.filter(c => !query || c.full_name.toLowerCase().includes(query))

      let html = ''

      if (!filtered.length) {
        html += '<p style="text-align:center; color:var(--gray600); font-size:.8rem; padding:1rem 0;">Nenhum candidato encontrado com este nome.</p>'
      } else {
        html += filtered.map(c => {
          const isSelected = selectedCandidateId === c.id
          const escapedName = (c.full_name || '').replace(/'/g, "\\'")
          return `
            <div class="candidate-card ${isSelected ? 'selected' : ''}" data-id="${c.id}" onclick="window.selectCandidate('${c.id}', '${escapedName}')">
              <div class="candidate-avatar-wrap">
                ${avatarHtml(c.full_name, 34, '.8rem', c.avatar_url)}
              </div>
              <div class="candidate-info">
                <div class="candidate-name" title="${c.full_name}">${c.full_name}</div>
                <div class="candidate-sub">Candidato(a) Elegível</div>
              </div>
              <div class="candidate-check-circle">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
              </div>
            </div>
          `
        }).join('')
      }

      listContainer.innerHTML = html
    }

    // Global selection handler
    window.selectCandidate = (id, name) => {
      selectedCandidateId = id
      selectedCandidateName = name
      clearAlert('ballot-alert')

      document.querySelectorAll('.candidate-card').forEach(el => {
        el.classList.toggle('selected', el.getAttribute('data-id') === id)
      })

      const btnText = document.getElementById('btn-cast-vote-text')
      const firstName = name.split(' ')[0]
      btnText.textContent = `Confirmar Voto em ${firstName}`
    }

    // Search input listener
    const searchInput = document.getElementById('candidate-search-input')
    searchInput?.addEventListener('input', (e) => {
      renderCandidatesCards(e.target.value)
    })

    // Render Ballot Form or Voted Screen
    function renderBallotScreen() {
      clearAlert('ballot-alert')
      selectedCandidateId = null
      selectedCandidateName = ''

      document.getElementById('ballot-title').textContent = currentSession.title

      const ROLE_LABELS = {
        presidente: 'Presidente',
        vice_presidente: 'Vice-Presidente',
        '1_secretario': '1º Secretário(a)',
        '2_secretario': '2º Secretário(a)',
        secretario_executivo: 'Secretário Executivo',
        tesoureiro: 'Tesoureiro(a)',
      }
      const roleLabel = ROLE_LABELS[currentSession.current_role] || currentSession.current_role

      document.getElementById('ballot-step-badge').textContent = roleLabel
      document.getElementById('ballot-role-label').textContent = `${currentSession.current_round}º Escrutínio`

      const activeState = document.getElementById('ballot-active-state')
      const votedState = document.getElementById('ballot-voted-state')

      if (currentSession.has_voted) {
        activeState.classList.add('hidden')
        votedState.classList.remove('hidden')
      } else {
        activeState.classList.remove('hidden')
        votedState.classList.add('hidden')

        const candidates = currentSession.candidates || []
        document.getElementById('candidates-count-badge').textContent = `${candidates.length} candidato${candidates.length !== 1 ? 's' : ''}`

        // Show search bar only if more than 5 candidates
        const searchWrap = document.getElementById('candidate-search-wrap')
        if (candidates.length > 5) {
          searchWrap.classList.remove('hidden')
          searchInput.value = ''
        } else {
          searchWrap.classList.add('hidden')
        }

        document.getElementById('btn-cast-vote-text').textContent = 'Selecione um Candidato'
        renderCandidatesCards()
      }
    }

    // Step 2: Cast Vote
    document.getElementById('btn-cast-vote').addEventListener('click', async () => {
      if (!selectedCandidateId) {
        showAlert('ballot-alert', 'Por favor, toque em um dos candidatos acima para votar.')
        return
      }

      const confirmMsg = `Deseja realmente confirmar seu voto secreto em "${selectedCandidateName}"? Uma vez enviado, não poderá ser alterado.`

      if (!confirm(confirmMsg)) {
        return
      }

      const btn = document.getElementById('btn-cast-vote')
      setLoading(btn, true, 'Confirmando Voto...')
      clearAlert('ballot-alert')

      try {
        const res = await fetch(`${API_URL}/api/elections/public/vote`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            code: voterCode,
            candidate_member_id: selectedCandidateId
          })
        })

        if (!res.ok) {
          const err = await res.json()
          throw new Error(err.detail || 'Erro ao registrar voto.')
        }

        currentSession.has_voted = true
        renderBallotScreen()
      } catch (err) {
        showAlert('ballot-alert', err.message)
      } finally {
        setLoading(btn, false, `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg> <span id="btn-cast-vote-text">Confirmar Voto</span>`)
      }
    })

    // Refresh status
    document.getElementById('btn-refresh-status').addEventListener('click', async () => {
      const btn = document.getElementById('btn-refresh-status')
      setLoading(btn, true, 'Aguarde...')
      clearAlert('ballot-alert')

      try {
        const res = await fetch(`${API_URL}/api/elections/public/session?code=${voterCode}`)
        if (!res.ok) {
          const err = await res.json()
          throw new Error(err.detail || 'Erro ao carregar sessão.')
        }
        const data = await res.json()

        const isSameRound = data.current_role === currentSession.current_role && data.current_round === currentSession.current_round
        const isStillVoted = data.has_voted
        const isCompleted = data.status === 'completed'

        currentSession = data
        renderBallotScreen()

        if (isSameRound && isStillVoted && !isCompleted) {
          showAlert('ballot-alert', 'O próximo escrutínio ainda não está pronto. Aguarde o administrador liberar a votação.', 'error')
        } else if (isCompleted) {
          showAlert('ballot-alert', 'A votação deste cargo/processo eleitoral foi encerrada.', 'success')
        }
      } catch (err) {
        showAlert('ballot-alert', err.message)
      } finally {
        setLoading(btn, false, `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg> <span>Votar Próximo Cargo</span>`)
      }
    })

    // Sair / Votar com outro código
    document.getElementById('btn-logout').addEventListener('click', () => {
      voterCode = ''
      currentSession = null
      selectedCandidateId = null
      selectedCandidateName = ''
      document.getElementById('voter-code').value = ''
      clearAlert('login-alert')
      clearAlert('ballot-alert')

      cardLogin.classList.remove('hidden')
      cardBallot.classList.add('hidden')
    })
  </script>
</body>

</html>
